name: Lint

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  xml-lint:
    runs-on: ubuntu-latest
    name: Validate info.xml
    steps:
      - uses: actions/checkout@v4
      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils wget
      - name: Validate appinfo/info.xml against Nextcloud schema
        run: |
          wget -q https://raw.githubusercontent.com/nextcloud/appstore/master/nextcloudappstore/api/v1/release/info.xsd
          xmllint --noout --schema info.xsd appinfo/info.xml

  php-lint:
    runs-on: ubuntu-latest
    name: PHP syntax lint (${{ matrix.php-version }})
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Check PHP syntax
        run: find lib appinfo -name '*.php' -print0 | xargs -0 -n1 php -l
